services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8080}:80"
    env_file:
      - .env
    environment:
      APP_URL: "http://localhost:${APP_PORT:-8080}"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-branchops}
      DB_USERNAME: ${DB_USERNAME:-branchops}
      DB_PASSWORD: ${DB_PASSWORD:-branchops}
      CACHE_STORE: redis
      REDIS_HOST: redis
      QUEUE_CONNECTION: database
      SESSION_DRIVER: database
    volumes:
      - storage-data:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-branchops}
      MYSQL_USER: ${DB_USERNAME:-branchops}
      MYSQL_PASSWORD: ${DB_PASSWORD:-branchops}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  storage-data:
